<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="Anterior view of the heart with the vessels and chambers labelled for the model's key features">
  <defs>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#14201E" stroke-opacity=".16" stroke-width=".7"/>
    </pattern>
    <clipPath id="body"><path id="bodyPath" d="M168 150 C124 146 96 182 98 226 C100 276 128 312 160 352 C192 392 230 426 268 428 C318 428 356 360 368 286 C376 240 370 190 336 160 C310 138 274 152 244 146 C220 142 198 152 168 150 Z"/></clipPath>
  </defs>
  <g transform="translate(150 0)">
  <g fill="none" stroke="#14201E" stroke-linecap="round" stroke-linejoin="round">
    <!-- great vessels (behind the body) -->
    <g>
      <!-- superior vena cava -->
      <path d="M140 160 L140 62" stroke-width="30"/>
      <path d="M140 160 L140 62" stroke="#C9D3CC" stroke-width="27"/>
      <!-- aortic arch -->
      <path d="M262 156 C262 92 270 60 306 60 C342 60 352 100 350 166" stroke-width="34"/>
      <path d="M262 156 C262 92 270 60 306 60 C342 60 352 100 350 166" stroke="#E7C9BF" stroke-width="31"/>
      <!-- pulmonary trunk -->
      <path d="M214 160 C206 124 198 108 186 96" stroke-width="30"/>
      <path d="M214 160 C206 124 198 108 186 96" stroke="#D6DDE3" stroke-width="27"/>
      <path d="M186 98 C180 90 174 86 168 86" stroke-width="22"/>
      <path d="M186 98 C180 90 174 86 168 86" stroke="#D6DDE3" stroke-width="19"/>
    </g>
    <!-- heart body -->
    <path d="M168 150 C124 146 96 182 98 226 C100 276 128 312 160 352 C192 392 230 426 268 428 C318 428 356 360 368 286 C376 240 370 190 336 160 C310 138 274 152 244 146 C220 142 198 152 168 150 Z" fill="#EBD3C8" stroke-width="2.2"/>
    <g clip-path="url(#body)">
      <!-- right atrium + auricle wash -->
      <path d="M90 140 C130 140 176 150 190 176 C170 230 150 262 118 286 C96 270 84 230 90 140Z" fill="#E2D2B8" stroke="none"/>
      <!-- left auricle wash -->
      <path d="M300 140 C350 150 384 200 372 270 C340 250 312 214 300 140Z" fill="#E2D2B8" stroke="none"/>
      <!-- left ventricle warm wash -->
      <path d="M210 180 C260 170 330 200 372 250 L372 440 L220 440 C214 360 206 260 210 180Z" fill="#D9A79B" fill-opacity=".55" stroke="none"/>
      <rect x="80" y="130" width="320" height="320" fill="url(#hatch)" stroke="none"/>
      <!-- coronary sulcus (atrioventricular groove) -->
      <path d="M118 286 C160 262 200 232 232 196 C268 176 312 188 372 250" stroke-width="1.4" stroke-opacity=".55"/>
      <!-- interventricular groove -->
      <path d="M214 160 C216 230 236 330 268 428" stroke-width="1.4" stroke-opacity=".55"/>
      <!-- anterior border shading -->
      <path d="M118 262 C140 330 190 400 262 424" stroke-width="1.1" stroke-opacity=".35"/>
      <path d="M338 214 C352 290 316 396 268 424" stroke-width="1.1" stroke-opacity=".35"/>
    </g>
    <!-- coronary arteries -->
    <g stroke="#A3302B" stroke-width="3.2">
      <path d="M214 164 C220 232 240 330 268 420"/>
      <path d="M232 214 C262 230 298 262 326 310" stroke-width="2.2"/>
      <path d="M226 252 C250 262 272 288 290 330" stroke-width="2"/>
      <path d="M118 290 C158 268 196 240 228 202 C196 196 160 214 150 244" stroke-width="2.4"/>
      <path d="M244 308 C264 322 282 350 294 384" stroke-width="1.8"/>
    </g>
    <!-- outline over everything -->
    <path d="M168 150 C124 146 96 182 98 226 C100 276 128 312 160 352 C192 392 230 426 268 428 C318 428 356 360 368 286 C376 240 370 190 336 160 C310 138 274 152 244 146 C220 142 198 152 168 150 Z" stroke-width="2.2"/>
    <!-- aorta root highlight -->
    <path d="M250 150 C256 160 270 158 276 148" stroke-width="1.4"/>
  </g>
  </g>
  <!-- leader lines and anchor dots -->
  <g stroke="#B58B4C" stroke-width="1" fill="none">
    <path d="M24 246 L300 246"/>
    <path d="M476 60 L556 60"/>
    <path d="M440 352 L470 400 L556 400"/>
  </g>
  <g fill="#B58B4C"><circle cx="300" cy="246" r="3.6"/><circle cx="476" cy="60" r="3.6"/><circle cx="440" cy="352" r="3.6"/></g>
  <g font-family="Montserrat, system-ui, sans-serif" fill="#14201E">
    <text x="24" y="226" font-size="13" font-weight="600">ca: major vessels</text>
    <text x="24" y="242" font-size="10.5" fill="#5B6360" dy="18">fluoroscopy, 0 to 3</text>
    <text x="562" y="56" font-size="13" font-weight="600">thalach: max HR</text>
    <text x="562" y="74" font-size="10.5" fill="#5B6360">peak exercise, 71–202 bpm</text>
    <text x="562" y="396" font-size="13" font-weight="600">oldpeak: ST depression</text>
    <text x="562" y="414" font-size="10.5" fill="#5B6360">exercise-induced, 0–6.2</text>
  </g>
</svg>
